        created_at: { type: number }
        completed_at: { type: number }
    RestrictedCountry:
      type: object
      required: [country]
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          example: KP
    Market:
      type: object
      required: [market_id, provider, symbol, coin, size_decimals, max_leverage]
      properties:
        market_id: { type: string, example: binance|BTCUSDT }
        provider:
          { type: string, enum: [binance, bybit, hyperliquid, lighter, fpx] }
        symbol:
          type: string
          example: BTC
          description: Display symbol for the market. Use coin for developer WebSocket subscriptions.
        coin:
          type: string
          example: BTCUSDT
          description: Exact venue symbol. Pass this value in the developer WebSocket symbols filter with this market's provider.
        size_decimals: { type: integer, minimum: 0 }
        max_leverage: { type: number, minimum: 1 }
        market_type: { type: string }
        category: { type: string }
        trading_enabled: { type: boolean }
        reduce_only: { type: boolean }
    Quote:
      type: object
      required: [status, market_id, provider, symbol, coin, bid, ask, mid, time]
      properties:
        status: { type: string, const: ok }
        market_id: { type: string }
        provider: { type: string }
        symbol: { type: string }
        coin: { type: string }
        bid:
          {
            type: number,
            nullable: true,
            description: Real best bid; null when unavailable for a mark-priced FX execution quote.,
          }
        ask:
          {
            type: number,
            nullable: true,
            description: Real best ask; null when unavailable for a mark-priced FX execution quote.,
          }
        mid:
          {
            type: number,
            nullable: true,
            description: Real book midpoint; not the FX execution reference.,
          }
        time: { type: number, description: Venue timestamp in milliseconds. }
        fillable:
          type: boolean
          description: Present when side and size were supplied.
        unfillable_reason:
          type: string
          enum: [empty_book, insufficient_depth, size_precision_mismatch]
        requested_side: { type: string, enum: [buy, sell] }
        requested_size: { type: number }
        reference_price:
          {
            type: number,
            nullable: true,
            description: Price reference for the execution estimate.,
          }
        reference_kind: { type: string, enum: [venue_mark, book_mid] }
        reference_time:
          {
            type: number,
            description: Execution reference timestamp in milliseconds.,
          }
        estimated_fill_price:
          type: number
          description: Whole-size simulated fill price; FX uses venue mark plus or minus its fixed size-tier spread.
        worst_price:
          type: number
          description: Same as estimated_fill_price for whole-size market fills.
        estimated_notional: { type: number }
        estimated_fee: { type: number }
        fee_bps: { type: number }
        levels_consumed: { type: integer }
        depth: { type: string, enum: [standard, deep] }
    Position:
      type: object
      required:
