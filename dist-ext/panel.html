<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mfp·flow — panel</title>
    <meta name="description" content="Live footprint, session volume profile and real aggressor delta for every MyFundedPerps market, straight from MFP's public market-data stream." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e11'/%3E%3Crect x='7' y='8' width='6' height='3' fill='%23e5484d'/%3E%3Crect x='7' y='13' width='14' height='3' fill='%23f5c542'/%3E%3Crect x='7' y='18' width='10' height='3' fill='%232bb673'/%3E%3Crect x='7' y='23' width='4' height='3' fill='%232bb673'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/panel-BocyAwoo.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-P2Xu9kJm.js">
    <link rel="stylesheet" crossorigin href="./assets/panel-D2-mN60a.css">
  </head>
  <body>
    <header class="bar">
      <div class="brand"><span class="logo" aria-hidden="true"></span>mfp<span class="dot">·</span>flow<span class="tagline">Context, not signals.</span></div>

      <div class="ctrl market">
        <label for="market" class="sr">Market</label>
        <select id="market"></select>
      </div>

      <div class="seg" id="view" role="radiogroup" aria-label="Chart view">
        <button data-v="footprint">Footprint</button><button data-v="profiles">Profiles</button><button data-v="tpo">TPO</button>
      </div>
      <button class="icon" id="help" title="What am I looking at?" aria-label="Explain this view">?</button>

      <div class="seg" id="tf" role="radiogroup" aria-label="Bar interval">
        <button data-v="1">1m</button><button data-v="5">5m</button><button data-v="15">15m</button><button data-v="30">30m</button>
      </div>

      <div class="ctrl">
        <label for="row">Row</label>
        <select id="row"></select>
      </div>

      <div class="ctrl">
        <label for="session">Session</label>
        <select id="session">
          <option value="utc">UTC day</option>
          <option value="ny18">18:00 ET</option>
        </select>
      </div>

      <div class="ctrl">
        <label for="days">Days</label>
        <select id="days"><option value="3">3</option><option value="5">5</option><option value="10">10</option></select>
      </div>

      <div class="ctrl">
        <label for="rprof">Right</label>
        <select id="rprof"><option value="session">Session</option><option value="composite">Composite</option></select>
      </div>

      <details class="menu" id="opts">
        <summary>Display</summary>
        <div class="menu-body">
          <label><input type="checkbox" id="optMarkers" /> Auction context markers</label>
          <label><input type="checkbox" id="optDiv" /> CVD divergence</label>
          <label><input type="checkbox" id="optEst" /> Include estimated delta in CVD</label>
          <label><input type="checkbox" id="optLiq" /> Liquidation bubbles (Binance only)</label>
          <label class="inline">Imbalance
            <select id="optImb"><option value="2">200%</option><option value="3">300%</option><option value="4">400%</option></select>
          </label>
          <label class="inline">Value area
            <select id="optVa"><option value="0.68">68%</option><option value="0.7">70%</option><option value="0.8">80%</option></select>
          </label>
          <label class="inline">Time
            <select id="optTz"><option value="local">Local</option><option value="UTC">UTC</option><option value="America/New_York">New York</option></select>
          </label>
          <label class="inline">Lower pane
            <select id="optLower"><option value="cvd">CVD</option><option value="oi">ΔOI / open interest</option></select>
          </label>
          <label class="stack">Recorder URL <span class="hint">optional · merges recorded trades as real</span>
            <input id="optRecorder" type="url" inputmode="url" placeholder="http://localhost:8787" autocomplete="off" spellcheck="false" />
          </label>
        </div>
      </details>

      <details class="menu" id="shareMenu">
        <summary>Share</summary>
        <div class="menu-body">
          <button type="button" id="snapDownload">Download PNG</button>
          <button type="button" id="snapCopy">Copy image</button>
          <button type="button" id="snapLink">Copy link</button>
          <p class="menu-note" id="shareNote">The link restores this exact view.</p>
        </div>
      </details>

      <div class="ctrl acct" id="acctCtrl" hidden>
        <label for="acct" class="sr">Account</label>
        <select id="acct"></select>
      </div>

      <div class="spacer"></div>
      <div class="status" id="status" aria-live="polite"><span class="led"></span><span class="txt">connecting…</span></div>
      <button class="icon" id="theme" title="Toggle light/dark" aria-label="Toggle light or dark theme">◐</button>
      <button class="icon" id="panelToggle" title="Context panel" aria-label="Toggle context panel">☰</button>
    </header>

    <main class="wrap">
      <section class="chart-host" id="chart" aria-label="Footprint chart">
        <div class="embed-note" id="embedNote" role="status" hidden></div>
        <div class="help-pop" id="helpPop" role="dialog" aria-labelledby="helpTitle" hidden>
          <h3 id="helpTitle"></h3>
          <ul id="helpList"></ul>
          <div class="help-foot">
            <span class="help-tag">Context, not signals.</span>
            <button type="button" id="helpGot">Got it</button>
          </div>
        </div>
      </section>
      <aside class="panel" id="panel" aria-label="Session context"></aside>
      <div class="acct-strip" id="acctStrip" hidden></div>
    </main>
  </body>
</html>
